<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green-950:#0a1e18;
    --green-900:#0e2621;
    --green-850:#123027;
    --gold-400:#e8c77e;
    --gold-500:#c9a063;
    --gold-600:#a67f42;
    --cream:#f6e5d1;
    --cream-dim: rgba(246,229,209,0.55);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    min-height:100%;
    background:
      radial-gradient(ellipse 120% 80% at 50% -10%, var(--green-850) 0%, var(--green-900) 45%, var(--green-950) 100%);
    color:var(--cream);
    font-family:'Cormorant Garamond', serif;
    overflow-x:hidden;
  }

  @media (prefers-reduced-motion: reduce){
    .fade-in{ animation:none !important; opacity:1 !important; }
  }

  .page{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 56px 22px 40px;
  }

  .fade-in{
    opacity:0;
    animation:fadeUp 0.9s ease forwards;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .wordmark{
    width:min(340px, 78vw);
    display:block;
    margin: 0 auto 56px;
    animation-delay:0.05s;
  }

  .links{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .link-card{
    position:relative;
    display:flex;
    align-items:center;
    gap:16px;
    padding:18px 22px;
    text-decoration:none;
    color:var(--cream);
    background: linear-gradient(180deg, rgba(246,229,209,0.03), rgba(246,229,209,0.01));
    border:1px solid rgba(201,160,99,0.4);
    border-radius:16px;
    transition: border-color 0.35s ease, background 0.35s ease, transform 0.25s ease;
    animation:fadeUp 0.9s ease forwards;
    opacity:0;
  }
  .link-card:nth-of-type(1){ animation-delay:0.4s; }
  .link-card:nth-of-type(2){ animation-delay:0.52s; }
  .link-card:nth-of-type(3){ animation-delay:0.64s; }

  .link-card:hover, .link-card:focus-visible{
    border-color:var(--gold-400);
    background: linear-gradient(180deg, rgba(201,160,99,0.14), rgba(201,160,99,0.05));
    transform: translateY(-2px);
  }
  .link-card:focus-visible{
    outline:2px solid var(--gold-400);
    outline-offset:3px;
  }

  .icon-wrap{
    flex:0 0 auto;
    width:38px;
    height:38px;
    border:1px solid rgba(201,160,99,0.55);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon-wrap svg{
    width:17px;
    height:17px;
    stroke:var(--gold-400);
    fill:none;
  }

  .link-text{ flex:1 1 auto; min-width:0; }
  .link-title{
    font-family:'Cinzel', serif;
    font-size:14.5px;
    letter-spacing:0.08em;
    color:var(--cream);
    text-transform:uppercase;
  }
  .link-sub{
    font-size:16px;
    font-style:italic;
    color:var(--cream-dim);
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .arrow{
    flex:0 0 auto;
    width:14px;
    height:14px;
    stroke:var(--gold-500);
    fill:none;
    transition:transform 0.3s ease;
  }
  .link-card:hover .arrow{ transform:translateX(3px); }

  footer{
    margin-top:56px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    animation:fadeUp 0.9s ease forwards;
    animation-delay:0.78s;
    opacity:0;
  }
  footer img{
    width:34px;
    height:34px;
    border-radius:50%;
    opacity:0.85;
  }
  footer p{
    font-family:'Cinzel', serif;
    font-size:10px;
    letter-spacing:0.22em;
    color: rgba(246,229,209,0.35);
    text-transform:uppercase;
  }
  footer .copyright{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:12px;
    letter-spacing:0.04em;
    color: rgba(246,229,209,0.28);
    text-transform:none;
    margin-top:2px;
  }
</style>
</head>
