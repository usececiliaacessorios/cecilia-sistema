<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green-950:#0a1e18;
    --green-900:#0e2621;
    --green-850:#123027;
    --gold-400:#e8c77e;
    --gold-500:#c9a063;
    --gold-600:#a67f42;
    --cream:#f6e5d1;
    --cream-dim: rgba(246,229,209,0.55);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    min-height:100%;
    background:
      radial-gradient(ellipse 120% 80% at 50% -10%, var(--green-850) 0%, var(--green-900) 45%, var(--green-950) 100%);
    color:var(--cream);
    font-family:'Cormorant Garamond', serif;
    overflow-x:hidden;
  }

  .stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
  }
  .stars svg{
    position:absolute;
    opacity:0;
    animation:twinkle 5.5s ease-in-out infinite;
  }
  .stars svg:nth-child(1){ top:8%; left:12%; width:14px; animation-delay:0s; }
  .stars svg:nth-child(2){ top:18%; left:82%; width:10px; animation-delay:1.2s; }
  .stars svg:nth-child(3){ top:32%; left:6%; width:8px; animation-delay:2.4s; }
  .stars svg:nth-child(4){ top:68%; left:88%; width:12px; animation-delay:0.7s; }
  .stars svg:nth-child(5){ top:78%; left:15%; width:9px; animation-delay:3.1s; }
  .stars svg:nth-child(6){ top:12%; left:48%; width:7px; animation-delay:1.8s; }
  .stars svg:nth-child(7){ top:88%; left:60%; width:11px; animation-delay:2.9s; }

  @keyframes twinkle{
    0%,100%{ opacity:0; transform:scale(0.6); }
    50%{ opacity:0.85; transform:scale(1); }
  }

  @media (prefers-reduced-motion: reduce){
    .stars svg{ animation:none; opacity:0.3; }
    .fade-in{ animation:none !important; opacity:1 !important; }
  }

  .page{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 56px 22px 40px;
  }

  .fade-in{
    opacity:0;
    animation:fadeUp 0.9s ease forwards;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .wordmark{
    width:min(340px, 78vw);
    display:block;
    margin: 0 auto 6px;
    animation-delay:0.05s;
  }

  .divider{
    display:flex;
    align-items:center;
    gap:14px;
    margin: 4px 0 40px;
    animation-delay:0.2s;
  }
  .divider .line{
    width:46px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold-500));
  }
  .divider .line.r{
    background:linear-gradient(90deg, var(--gold-500), transparent);
  }
  .divider svg{ width:11px; height:11px; }

  .tag{
    font-family:'Cinzel', serif;
    font-size:11px;
    letter-spacing:0.32em;
    color:var(--gold-400);
    text-transform:uppercase;
    margin-bottom:34px;
    text-align:center;
    animation-delay:0.3s;
  }

  .links{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .link-card{
    position:relative;
    display:flex;
    align-items:center;
    gap:16px;
    padding:18px 22px;
    text-decoration:none;
    color:var(--cream);
    background: linear-gradient(180deg, rgba(246,229,209,0.03), rgba(246,229,209,0.01));
    border:1px solid rgba(201,160,99,0.4);
    border-radius:2px;
    transition: border-color 0.35s ease, background 0.35s ease, transform 0.25s ease;
    animation:fadeUp 0.9s ease forwards;
    opacity:0;
  }
  .link-card:nth-of-type(1){ animation-delay:0.4s; }
  .link-card:nth-of-type(2){ animation-delay:0.52s; }
  .link-card:nth-of-type(3){ animation-delay:0.64s; }

  .link-card:hover, .link-card:focus-visible{
    border-color:var(--gold-400);
    background: linear-gradient(180deg, rgba(201,160,99,0.14), rgba(201,160,99,0.05));
    transform: translateY(-2px);
  }
  .link-card:focus-visible{
    outline:2px solid var(--gold-400);
    outline-offset:3px;
  }

  .icon-wrap{
    flex:0 0 auto;
    width:38px;
    height:38px;
    border:1px solid rgba(201,160,99,0.55);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon-wrap svg{
    width:17px;
    height:17px;
    stroke:var(--gold-400);
    fill:none;
  }

  .link-text{ flex:1 1 auto; min-width:0; }
  .link-title{
    font-family:'Cinzel', serif;
    font-size:14.5px;
    letter-spacing:0.08em;
    color:var(--cream);
    text-transform:uppercase;
  }
  .link-sub{
    font-size:16px;
    font-style:italic;
    color:var(--cream-dim);
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .arrow{
    flex:0 0 auto;
    width:14px;
    height:14px;
    stroke:var(--gold-500);
    fill:none;
    transition:transform 0.3s ease;
  }
  .link-card:hover .arrow{ transform:translateX(3px); }

  footer{
    margin-top:56px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    animation:fadeUp 0.9s ease forwards;
    animation-delay:0.78s;
    opacity:0;
  }
  footer img{
    width:34px;
    height:34px;
    border-radius:50%;
    opacity:0.85;
  }
  footer p{
    font-family:'Cinzel', serif;
    font-size:10px;
    letter-spacing:0.22em;
    color: rgba(246,229,209,0.35);
    text-transform:uppercase;
  }
</style>
</head>
